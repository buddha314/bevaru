[workspace]
members = [".", "crates/bevaru-core", "crates/bevaru-mcp"]
# A standalone Jackdaw project with its own workspace; see docs/jackdaw.md.
exclude = ["jackdaw"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/buddha314/bevaru"

# Index loops read better in the numeric code; Bevy systems routinely take
# many parameters and nested generic types.
[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[package]
name = "bevaru"
version = "0.1.0"
edition.workspace = true
description = "A Bevy plugin that uses ruviz for machine-learning oriented plotting"
license.workspace = true
repository.workspace = true
default-run = "bevaru"

[lints]
workspace = true

[features]
default = ["math"]
mnist = ["bevaru-core/mnist"]
# Typeset formulas (diagram tooltips) with Typst through ruviz. Adds about
# 32 MB, mostly embedded fonts; without it, formulas show as plain text.
math = ["ruviz/typst-math"]
# Drive a running app over Bevy Remote Protocol (localhost); see `bevaru::remote`.
remote = ["bevy/bevy_remote"]

[[bin]]
name = "bevaru"
path = "src/main.rs"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
# Replies to in-process Bevy Remote Protocol requests in tests.
async-channel = "2"

[[example]]
name = "mnist_svm"
required-features = ["mnist"]

[dependencies]
bevaru-core = { path = "crates/bevaru-core", version = "0.1.0" }
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "3d"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
ruviz = { version = "=0.14.2", features = ["3d"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Already in the tree via bevy_image; used directly to crop and scale thumbnails.
image = { version = "0.25", default-features = false, features = ["png"] }

# Bevy and the linear algebra are unusably slow unoptimized; keep our own
# crates fast to compile but optimize dependencies.
[profile.dev.package."*"]
opt-level = 2

# The core is all numerics; unoptimized, a 784-D training step takes ~100x longer.
[profile.dev.package.bevaru-core]
opt-level = 2
