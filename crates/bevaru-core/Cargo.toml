[package]
name = "bevaru-core"
version = "0.1.0"
edition.workspace = true
description = "Bevy-independent loss functions, linear models, and datasets for bevaru"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
mnist = ["dep:ureq", "dep:sha2", "dep:dirs", "dep:flate2"]

[dependencies]
nalgebra = "0.35"
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
ureq = { version = "3", optional = true }
sha2 = { version = "0.11", optional = true }
dirs = { version = "7", optional = true }
flate2 = { version = "1", optional = true }
