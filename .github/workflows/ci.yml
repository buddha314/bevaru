name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Bevy builds are large and this job builds several feature sets; full
  # debug info and incremental caches overflowed the runner's disk (the
  # linker died with SIGBUS). CI never needs a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features mnist,remote -- -D warnings
      - name: Core tests (no Bevy)
        run: cargo test -p bevaru-core
      - name: Core tests with MNIST loader
        run: cargo test -p bevaru-core --features mnist
      - name: Plugin tests (headless)
        run: cargo test -p bevaru
      - name: Remote-control tests
        run: cargo test -p bevaru --features remote
      - name: Build examples
        run: cargo build --examples --features mnist
      - name: Agent tools (MCP server, headless end to end)
        run: cargo test -p bevaru-mcp
      - name: Core has no Bevy dependency
        run: |
          if cargo tree -p bevaru-core --features mnist -e normal | grep -q '\bbevy'; then
            echo "bevaru-core must not depend on bevy"; exit 1
          fi
      - name: No HTTP client without the mnist feature
        run: |
          if cargo tree -p bevaru -e normal | grep -q '\bureq\b'; then
            echo "ureq must only be pulled in by the mnist feature"; exit 1
          fi
